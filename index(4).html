<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#a9e6ff">
<title>Travessia Pixel</title>
<style>
:root{--ink:#1e2b40;--cream:#fff9e8;--sky:#bfefff;--green:#72d6a3;--yellow:#ffdb70;--coral:#ff8875}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:var(--sky);font-family:system-ui,"Trebuchet MS",sans-serif;color:var(--ink)}button{font:inherit;color:inherit;touch-action:manipulation}.shell{width:min(920px,100%);background:var(--cream);border:4px solid var(--ink);border-radius:10px;box-shadow:9px 9px 0 #77abc4;overflow:hidden}.bar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:3px solid var(--ink);background:#fff1bd}.logo{font-weight:1000;letter-spacing:.07em;font-size:14px;display:flex;gap:8px;align-items:center}.logo b{font-size:25px}.score{font-weight:950;border:2px solid var(--ink);border-radius:20px;background:#fff;padding:5px 11px}.board{position:relative;margin:14px auto 8px;width:min(800px,calc(100% - 22px));border:4px solid var(--ink);border-radius:7px;overflow:hidden;background:#9ce1ff;box-shadow:inset 0 0 0 3px #fff}.board canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#1b2b47b8;padding:14px}.card{width:min(440px,100%);background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 #405477;border-radius:8px;text-align:center;padding:18px}.titlePixels{font-size:clamp(22px,5vw,36px);font-weight:1000;line-height:1.1;text-shadow:2px 2px #ffdc7a}.icons{font-size:clamp(27px,6vw,43px);letter-spacing:8px;margin:8px 0}.small{font-size:12px;font-weight:800;color:#64718a;margin:8px}.primary,.soft{border:3px solid var(--ink);border-radius:8px;padding:11px 18px;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 #8190a7}.primary{background:var(--green);font-size:18px}.soft{background:#fff1bd}.primary:active,.soft:active,.dpad button:active{transform:translateY(2px);box-shadow:0 2px 0 #8190a7}.primary:focus-visible,.soft:focus-visible,.dpad button:focus-visible{outline:4px solid #ff8b50;outline-offset:2px}.controls{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;width:min(800px,calc(100% - 22px));margin:0 auto 14px}.tip{font-weight:900;font-size:13px;line-height:1.4}.dpad{display:grid;grid-template-columns:45px;grid-template-rows:41px 41px;gap:4px;justify-items:center}.dpad button{width:44px;height:40px;border:2px solid var(--ink);border-radius:7px;background:#fff;font-size:21px;font-weight:1000;box-shadow:0 3px 0 #9eabc0;cursor:pointer}.dpad [data-dir=up]{grid-area:1/1}.dpad [data-dir=down]{grid-area:2/1}.actions{display:flex;gap:8px;align-items:center}.actions button{min-height:42px}.help{background:#d9d3ff}.bottom{border-top:3px solid var(--ink);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:850;color:#5c6880}.badgeRow{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px 0}.badge{border:2px solid var(--ink);border-radius:8px;background:white;padding:8px 10px;min-width:95px;font-size:12px;font-weight:900}.badge span{display:block;font-size:25px}.badge.lock{filter:grayscale(1);opacity:.4}.lessonText{font-size:16px;line-height:1.45;min-height:62px;padding:8px;color:#38455d}.victoryActions{display:flex;gap:9px;justify-content:center;align-items:center}.victoryActions button{min-width:70px}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){body{padding:0;background:var(--cream)}.shell{min-height:100vh;border-width:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column}.bar{height:52px}.board{width:calc(100% - 16px);margin:9px auto 5px}.controls{width:calc(100% - 16px);grid-template-columns:1fr auto;gap:6px;margin-bottom:9px}.tip{font-size:11px}.dpad{grid-template-columns:39px;grid-template-rows:36px 36px;gap:3px}.dpad button{width:38px;height:35px;font-size:18px}.actions{flex-direction:column;gap:5px}.actions button{font-size:11px;padding:5px 7px;min-height:36px}.bottom{margin-top:auto;padding:7px 9px}}
</style>
</head>
<body>
<main class="shell">
<header class="bar"><div class="logo"><b>🚸</b><span>TRAVESSIA PIXEL</span></div><div class="score" aria-label="Estrelas acumuladas">⭐ <span id="starCount">0</span></div></header>
<div class="board"><canvas id="game" width="640" height="420" aria-label="Jogo: ajude a menina a atravessar com segurança até a mãe"></canvas><div class="overlay" id="cover"><div class="card"><div class="titlePixels">MISSÃO<br>TRAVESSIA!</div><div class="icons">🛑 👀 ✋</div><div class="small">⬆️ ATRAVESSAR　　✋ PEDIR AJUDA</div><button class="primary" id="start">▶ JOGAR</button></div></div><div class="overlay hidden" id="intro"><div class="card"><div class="titlePixels">ESSA É A LILA!</div><div class="icons">👧 💭 🏠</div><div class="lessonText" id="introText">Oi, eu sou a Lila! Quero chegar em casa, mas às vezes fico na dúvida para atravessar. Você me ajuda a esperar os carros pararem?</div><div class="victoryActions"><button class="soft" id="introVoice" aria-label="Ouvir a Lila">🔊</button><button class="primary" id="beginMission">VAMOS!</button></div></div></div><div class="overlay hidden" id="victory"><div class="card"><div class="titlePixels">⭐ MUITO BEM!</div><div class="icons">🚸</div><div class="lessonText" id="lessonText"></div><div class="victoryActions"><button class="soft" id="speakLesson" aria-label="Ouvir de novo">🔊</button><button class="primary" id="nextStep" aria-label="Continuar">▶</button></div></div></div><div class="overlay hidden" id="end"><div class="card"><div class="titlePixels" id="endTitle">VIVA!</div><div class="icons" id="endIcons">👧 💕 👩</div><div class="badgeRow" id="badges"></div><div class="score">⭐ <span id="endStars">0</span></div><p class="small">↻ JOGAR DE NOVO</p><button class="primary" id="replay">↻</button></div></div></div>
<div class="controls"><div><div class="actions"><button class="soft help" id="help" aria-label="Pedir ajuda ao tio da van">✋ PEDIR AJUDA</button></div></div><div class="dpad" aria-label="Controles do jogo"><button data-dir="up" aria-label="Para frente">⬆</button><button data-dir="down" aria-label="Para trás">⬇</button></div></div>
<footer class="bottom"><span>🚐</span><span id="phaseLabel">FASE 1</span><span>👩</span></footer><div class="sr" id="announce" aria-live="assertive"></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),cover=document.getElementById('cover'),introPanel=document.getElementById('intro'),victoryPanel=document.getElementById('victory'),endPanel=document.getElementById('end'),startBtn=document.getElementById('start'),introVoiceBtn=document.getElementById('introVoice'),beginMissionBtn=document.getElementById('beginMission'),helpBtn=document.getElementById('help'),replayBtn=document.getElementById('replay'),speakBtn=document.getElementById('speakLesson'),nextBtn=document.getElementById('nextStep');
const W=640,H=420,roadTop=112,roadBottom=336,crossX=320;
const spriteGirl=['..HHHH..','.HHHHHH.','.HSSSSH.','.HSSSSH.','..SSSS..','.RRRRRR.','RRRRRRRR','.RRRRRR.','..BBBB..','..BBBB..','.BB..BB.','.BB..BB.'];
const spriteMom=['..HHHH..','.HHHHHH.','.HSSSSH.','.HSSSSH.','..SSSS..','.PPPPPP.','PPPPPPPP','.PPPPPP.','..BBBB..','..BBBB..','.BB..BB.','.BB..BB.'];
const spriteUncle=['..HHHH..','.HHHHHH.','.HSSSSH.','.HSSSSH.','..SSSS..','.TTTTTT.','TTTTTTTT','.TTTTTT.','..BBBB..','..BBBB..','.BB..BB.','.BB..BB.'];
const spriteHand=['..SS.','..SS.','SSSS.','SSSSS','.SSS.','..C..','..C..'];
const palettes={girl:{H:'#633b2b',S:'#f2ba82',R:'#ed6c70',B:'#425b9d'},mom:{H:'#4a2d29',S:'#f0b47b',P:'#9b6bc4',B:'#375b86'},uncle:{H:'#54392a',S:'#d99a66',T:'#4fba96',B:'#38577a'}};
const skies=['#a5e8ff','#ffd989','#9ec5e0','#ffd5a5'],grasses=['#86cf83','#91c76d','#77b989','#8bcf9a'];
function difficulty(){let phase=level+1;return {phase,lanes:Math.min(5,2+phase),cycle:Math.max(4400,6400-(phase-1)*250),green:Math.max(1600,4100-(phase-1)*320),speed:52*Math.pow(1.1,phase-1),sky:skies[(phase-1)%skies.length],grass:grasses[(phase-1)%grasses.length],weather:phase>=4}}
let data=readSave(),level=0,state='ready',player={x:crossX,y:368},cars=[],elapsed=0,lastTime=0,lockTraffic=false,alertUntil=0,alertType='',uncleHomeX=230,helperChosen=false,escortWait=0,escortTick=0,endingTime=0,toastUntil=0,toastText='',nextIsFinal=false,phaseAdvancePending=false,crossingsInPhase=0,penaltyCooldown=0,lessonTimer=0,currentLesson='';
function readSave(){try{let saved=JSON.parse(localStorage.getItem('travessiaPixelSave')||'{}');if(!saved.progressionV2){saved.level=1;saved.phaseCrossings=0;saved.totalCrossings=0;saved.progressionV2=2}return Object.assign({stars:0,badges:[],level:1,phaseCrossings:0,totalCrossings:0,done:false},saved)}catch{return {stars:0,badges:[],level:1,phaseCrossings:0,totalCrossings:0,progressionV2:2,done:false}}}
function save(){data.progressionV2=2;localStorage.setItem('travessiaPixelSave',JSON.stringify(data));document.getElementById('starCount').textContent=data.stars}
function announce(s){document.getElementById('announce').textContent=s}
function badge(id){if(!data.badges.includes(id)){data.badges.push(id);save();toastText='🏅 CONQUISTA!';toastUntil=performance.now()+1600}}
function makeCars(){cars=[];let def=difficulty(),phase=def.phase,types=data.totalCrossings>=3?['car','car','bus','truck']:['car'];let colors=['#ef6b63','#4f84da','#e9bd49','#ad70bc','#46aa86'];for(let i=0;i<def.lanes;i++){let dir=i%2?1:-1,count=2+(i%2),spacing=W/count;for(let j=0;j<count;j++){let type=types[Math.floor(Math.random()*types.length)],w=type==='bus'?88:type==='truck'?82:58;let speed=def.speed*(phase>=2?(1+Math.random()*.15):1);cars.push({lane:i,x:110+j*spacing+((i*63+j*31)%60),dir,w,h:24,color:colors[(i+j)%colors.length],type,speed})}}}
function newLevel(n){level=Math.max(0,n-1);elapsed=0;player={x:crossX,y:368};lockTraffic=false;alertUntil=0;state='playing';escortWait=0;escortTick=0;helperChosen=false;makeCars();document.getElementById('phaseLabel').textContent='FASE '+(level+1);lastTime=performance.now()}
function begin(){if(window.speechSynthesis)window.speechSynthesis.cancel();cover.classList.add('hidden');introPanel.classList.add('hidden');endPanel.classList.add('hidden');let first=data.done?1:Math.max(1,data.level||1);crossingsInPhase=data.done?0:(data.phaseCrossings||0);if(data.done)data.totalCrossings=0;data.done=false;data.level=first;save();newLevel(first)}
function openIntro(){cover.classList.add('hidden');introPanel.classList.remove('hidden');const text='Oi, eu sou a Lila! Quero chegar em casa, mas às vezes fico na dúvida para atravessar. Você me ajuda a esperar os carros pararem?';announce(text);speakIntro()}
function speakIntro(){if(window.speechSynthesis&&window.SpeechSynthesisUtterance){window.speechSynthesis.cancel();let u=new window.SpeechSynthesisUtterance('Oi, eu sou a Lila! Quero chegar em casa, mas às vezes fico na dúvida para atravessar. Você me ajuda a esperar os carros pararem?');u.lang='pt-BR';u.rate=.9;window.speechSynthesis.speak(u)}}
function stopWarning(type){alertType=type;alertUntil=performance.now()+2600;if(type==='wait'){if(performance.now()>=penaltyCooldown){data.stars=Math.max(0,data.stars-1);save();penaltyCooldown=performance.now()+2600}announce('Oh não! Cuidado com os carros. Atravesse apenas quando os carros pararem.')}else announce(type==='cross'?'Use a faixa de pedestres.':'Peça ajuda ao tio');}
function isRoad(y){return y>roadTop-2&&y<roadBottom+2}
function inZebra(c){return c.x+c.w/2>crossX-35&&c.x-c.w/2<crossX+35}
function trafficYielding(){let def=difficulty();return state==='escort'||elapsed%def.cycle>=def.cycle-def.green}
function trafficClear(){return cars.every(c=>!inZebra(c))}
function greenForPedestrians(){return lockTraffic||(trafficYielding()&&trafficClear())}
function step(dir){if(state!=='playing')return;if(dir==='up'){const onRoad=isRoad(player.y);if(onRoad&&Math.abs(player.x-crossX)>22){stopWarning('cross');return}if(!lockTraffic){if(!trafficYielding()||!trafficClear()){stopWarning('wait');return}lockTraffic=true}player.y-=31;if(player.y<=roadTop-4)completeLevel();return}if(dir==='down'){if(isRoad(player.y)&&lockTraffic){player.y=Math.min(roadBottom+1,player.y+31);if(player.y>=roadBottom)lockTraffic=false}return}if(dir==='left'||dir==='right'){if(isRoad(player.y)){stopWarning('cross');return}player.x=Math.max(52,Math.min(W-52,player.x+(dir==='left'?-32:32)))}}

function requestHelp(){if(state!=='playing')return;state='escort';lockTraffic=false;escortWait=0;escortTick=0;helperChosen=true;badge('help');announce('O tio vem ajudar.');}
function drawBadges(){const host=document.getElementById('badges');host.innerHTML='';[{id:'cross',icon:'🚸'},{id:'help',icon:'🤝'},{id:'mom',icon:'💖'}].forEach(b=>{let d=document.createElement('div');d.className='badge'+(data.badges.includes(b.id)?'':' lock');d.innerHTML='<span>'+b.icon+'</span>';host.appendChild(d)})}
function speakCurrentLesson(){if(lessonTimer)clearTimeout(lessonTimer);if(window.speechSynthesis)window.speechSynthesis.cancel();if(window.speechSynthesis&&window.SpeechSynthesisUtterance){let u=new window.SpeechSynthesisUtterance(currentLesson);u.lang='pt-BR';u.rate=.88;u.onend=()=>{lessonTimer=window.setTimeout(continueAfterLesson,850)};u.onerror=()=>{lessonTimer=window.setTimeout(continueAfterLesson,3200)};window.speechSynthesis.speak(u)}else{lessonTimer=window.setTimeout(continueAfterLesson,4300)}}
function showLesson(assisted){let phase=level+1;let lessons=['Na faixa, espere os carros pararem.','Olhe para os dois lados e atravesse com um adulto.','Atravesse na faixa e continue olhando.'];currentLesson=assisted?'Pedir ajuda a um adulto é uma escolha segura.':lessons[Math.min(phase-1,2)];document.getElementById('lessonText').textContent=currentLesson;victoryPanel.classList.remove('hidden');speakCurrentLesson()}
function continueAfterLesson(){if(state!=='victory')return;if(lessonTimer)clearTimeout(lessonTimer);lessonTimer=0;if(window.speechSynthesis)window.speechSynthesis.cancel();victoryPanel.classList.add('hidden');if(nextIsFinal){badge('mom');data.done=true;data.level=1;data.phaseCrossings=0;save();state='ending';endingTime=performance.now();endPanel.classList.remove('hidden');document.getElementById('endTitle').textContent='VIVA!';document.getElementById('endIcons').textContent='👧 💕 👩';document.getElementById('endStars').textContent=data.stars;drawBadges()}else{if(phaseAdvancePending){level++;crossingsInPhase=0;data.level=level+1;data.phaseCrossings=0}else{data.level=level+1;data.phaseCrossings=crossingsInPhase}save();newLevel(level+1)}}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawSprite(sprite,x,y,scale,pal){sprite.forEach((row,ry)=>{for(let rx=0;rx<row.length;rx++){let c=row[rx];if(pal[c])px(x+rx*scale,y+ry*scale,scale,scale,pal[c])}})}
function drawHouse(x,y,w,h,col){px(x,y,w,h,col);px(x-6,y-9,w+12,13,'#b95754');px(x+10,y+14,13,14,'#bdf3ff');px(x+w-24,y+14,13,14,'#bdf3ff');px(x+w/2-8,y+h-27,16,27,'#855a4d')}
function drawVan(){let x=82,y=359;px(x,y,113,37,'#f2c94c');px(x+18,y-15,76,18,'#f2c94c');px(x+28,y-11,22,11,'#aee8ff');px(x+57,y-11,25,11,'#aee8ff');px(x+2,y+8,8,8,'#fff0b5');px(x+103,y+9,8,8,'#f36e62');px(x+15,y+31,18,12,'#29384e');px(x+83,y+31,18,12,'#29384e');px(x+19,y+34,10,7,'#9fb4bd');px(x+87,y+34,10,7,'#9fb4bd');px(x+46,y+15,30,8,'#fff4d1')}
function drawCar(car){let def=difficulty(),roadLaneH=(roadBottom-roadTop)/def.lanes,cy=roadTop+roadLaneH*(car.lane+.5),x=car.x-car.w/2,y=cy-12,w=car.w;ctx.save();if(car.dir>0){ctx.translate(car.x,cy);ctx.scale(-1,1);x=-w/2;y=-12}if(car.type==='bus'){px(x+3,y+2,w-6,22,car.color);px(x+8,y+5,13,8,'#bdefff');px(x+25,y+5,13,8,'#bdefff');px(x+42,y+5,13,8,'#bdefff');px(x+59,y+5,13,8,'#bdefff');px(x+5,y+15,w-10,3,'#fff1bd')}else if(car.type==='truck'){px(x+4,y+7,w-8,15,car.color);px(x+w-34,y+1,27,21,'#f3c36e');px(x+w-29,y+4,13,8,'#bdefff')}else{px(x+4,y+7,w-8,16,car.color);px(x+15,y,w-28,12,car.color);px(x+20,y+2,16,8,'#bdefff');px(x+39,y+2,13,8,'#bdefff')}px(x+7,y+12,6,5,'#fff0a5');px(x+w-13,y+12,6,5,'#fd6865');px(x+12,y+20,13,7,'#202c40');px(x+w-25,y+20,13,7,'#202c40');px(x+15,y+22,7,4,'#92a9b5');px(x+w-22,y+22,7,4,'#92a9b5');ctx.restore()}
function drawSignal(green){px(383,122,25,55,'#36445c');px(388,128,15,15,green?'#ff5c57':'#a73d47');px(388,151,15,15,green?'#54e08d':'#346346');if(green){px(414,149,12,3,'#fff');px(422,144,5,13,'#fff');}}
function drawWorld(now){ctx.clearRect(0,0,W,H);let def=difficulty();px(0,0,W,roadTop,def.sky);drawHouse(14,34,64,75,'#f7b77f');drawHouse(535,29,75,81,'#c5b0e7');drawHouse(256,20,128,60,'#f4c170');px(0,80,W,32,def.grass);px(0,roadTop,W,roadBottom-roadTop,'#596477');px(0,roadBottom,W,H-roadBottom,'#dfd4b1');px(0,roadTop,W,5,'#f1f3e6');px(0,roadBottom-4,W,5,'#f1f3e6');
let laneH=(roadBottom-roadTop)/def.lanes;for(let i=1;i<def.lanes;i++){let y=roadTop+i*laneH;for(let x=8;x<W;x+=50)px(x,y,26,3,'#d6dce1')}
// Safe crossing stripes
for(let y=roadTop+4;y<roadBottom-4;y+=31)px(crossX-28,y,56,17,'#fffbe8');px(crossX-35,roadTop,4,roadBottom-roadTop,'#ffe07b');px(crossX+31,roadTop,4,roadBottom-roadTop,'#ffe07b');
// Arrival sidewalk and little garden
px(0,77,W,6,'#a6cb76');px(281,53,78,9,'#fff3ca');px(301,47,38,8,'#dfbf7e');
// traffic light and destination mother
let green=greenForPedestrians()||state==='victory'||state==='levelwin'||state==='ending';if(level===0)drawSignal(green);drawSprite(spriteMom,302,55,3,palettes.mom);
// Starting school van, adult and pavement tiles
drawVan();for(let x=0;x<W;x+=32)px(x,397,24,3,'#ccb98f');
// traffic flows until pedestrian light gives the stop cue
let yielding=trafficYielding();if(state==='playing'||state==='escort'){cars.forEach(c=>{if(!yielding||inZebra(c)){c.x+=c.dir*c.speed*(1/60);if(c.dir>0&&c.x>W+90)c.x=-90;if(c.dir<0&&c.x<-90)c.x=W+90}})}cars.forEach(drawCar);
if(def.weather){for(let i=0;i<14;i++){let x=(i*57+(now/18))%W,y=(i*37+(now/8)%100)%320;px(x,y,2,11,'#d3f0ff')}}
if(state==='ending'){let bob=Math.sin(now/170)*2;drawSprite(spriteGirl,296,58+bob,3,palettes.girl);drawSprite(spriteMom,326,58-bob,3,palettes.mom);for(let i=0;i<4;i++){let hx=286+i*24,hy=39+Math.sin(now/220+i)*8;px(hx,hy,6,6,'#ff7795');px(hx+5,hy-4,6,6,'#ff7795');px(hx+10,hy,6,6,'#ff7795');px(hx+5,hy+5,6,6,'#ff7795')}}else{drawSprite(spriteGirl,player.x-12,player.y-36,3,palettes.girl)}
if(helperChosen&&state==='ending'){drawSprite(spriteUncle,260,58,3,palettes.uncle)}else if(helperChosen){let approach=state==='escort'?Math.min(1,escortWait/620):1;let ux=state==='escort'?uncleHomeX+(player.x-31-uncleHomeX)*approach:player.x-31;let uy=state==='escort'&&approach<1?368:player.y;drawSprite(spriteUncle,ux-12,uy-36,3,palettes.uncle);if(state==='escort'&&approach>=1)px(player.x-6,player.y-23,10,3,'#fff1b9')}else if(state!=='ending'){drawSprite(spriteUncle,uncleHomeX-12,368-36,3,palettes.uncle)}
// scene cue and level number
px(11,10,102,26,'#fff9e8');ctx.fillStyle='#27354c';ctx.font='bold 15px monospace';ctx.fillText('FASE '+(level+1),20,29);
if(level===0&&state==='playing'){if(green){px(262,roadTop+5,116,18,'#58d990');ctx.fillStyle='#153e36';ctx.font='bold 12px monospace';ctx.fillText('PODE IR!',286,118);let signalCar=cars.slice().filter(c=>!inZebra(c)).sort((a,b)=>Math.abs(a.x-crossX)-Math.abs(b.x-crossX))[0];if(signalCar){let handY=roadTop+laneH*(signalCar.lane+.5);let handX=signalCar.x<crossX?crossX-66:crossX+48;drawSprite(spriteHand,handX,handY-27,2,{S:'#ffdaa7',C:'#fff3c4'})}}else{px(262,roadTop+5,116,18,'#ffda73');ctx.fillStyle='#59451d';ctx.font='bold 12px monospace';ctx.fillText('ESPERE',292,118)}}
if(now<alertUntil){px(110,75,420,65,'#fff9e8');px(110,75,420,4,'#ff756a');ctx.fillStyle='#27354c';ctx.textAlign='center';ctx.font='bold 12px monospace';if(alertType==='wait'){ctx.fillText('OH NÃO! CUIDADO COM OS CARROS.',320,101);ctx.fillText('ATRAVESSE APENAS QUANDO',320,118);ctx.fillText('OS CARROS PARAREM.',320,133)}else{ctx.fillText(alertType==='cross'?'USE A FAIXA DE PEDESTRES':'PEÇA AJUDA AO TIO',320,111)}ctx.textAlign='start'}if(now<toastUntil){px(199,44,242,31,'#ffdf76');ctx.fillStyle='#27354c';ctx.font='bold 15px monospace';ctx.fillText(toastText,223,65)}
}
function completeLevel(){if(state!=='playing'&&state!=='escort')return;let assisted=state==='escort';state='victory';lockTraffic=true;data.stars++;data.totalCrossings=(data.totalCrossings||0)+1;crossingsInPhase++;data.phaseCrossings=crossingsInPhase;badge('cross');save();phaseAdvancePending=crossingsInPhase>=3;nextIsFinal=phaseAdvancePending&&level>=2;showLesson(assisted)}
function animate(now){let dt=Math.min(45,now-lastTime||16);lastTime=now;if(state==='playing')elapsed+=dt;if(state==='escort'){if(!trafficClear()){escortWait=0;escortTick=0}else{lockTraffic=true;escortWait+=dt;if(escortWait>620){escortTick+=dt;if(escortTick>410){escortTick=0;player.y-=31;if(player.y<=roadTop-5)completeLevel()}}}}drawWorld(now);requestAnimationFrame(animate)}
startBtn.addEventListener('click',openIntro);beginMissionBtn.addEventListener('click',begin);introVoiceBtn.addEventListener('click',speakIntro);helpBtn.addEventListener('click',requestHelp);speakBtn.addEventListener('click',speakCurrentLesson);nextBtn.addEventListener('click',continueAfterLesson);replayBtn.addEventListener('click',()=>{endPanel.classList.add('hidden');begin()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>step(b.dataset.dir)));window.addEventListener('keydown',e=>{let map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();step(map[e.key])}if(e.key===' '){e.preventDefault();requestHelp()}});canvas.addEventListener('click',()=>step('up'));save();requestAnimationFrame(animate);
